name: Regression check

# Compile-checks every example sketch against this branch's own
# hardware/nxp/mcx source (not a released/installed version), for every
# board. Two speed tiers, chosen after measuring locally what actually
# moves the needle (see CLAUDE.md's "0.5以降のロードマップ方針" and
# "0.5: CI" sections for the numbers behind these choices):
#   fast - release_check/** + hello_world + mcxPinState examples.
#          Runs on every push/PR; a few minutes.
#   full - every example under examples/ and mcxPinState/examples/.
#          Runs on push to main, workflow_dispatch, and version tags --
#          not on every push, since it's the same fast-tier sketches
#          plus everything else, at several times the cost.
#          With it, in jobs of their own beside it, the examples of
#          pinned third-party libraries (.github/third_party/
#          libraries.txt: ArduinoJson, Ethernet, PubSubClient, ...),
#          against a list of the ones known not to build
#          (expected_failures.txt); on FRDM-MCXN947 also the Ethernet
#          examples on the bundled MCXEthernet.
#
# The toolchain to install and its download URL/checksum are read
# straight out of package_nxp_mcx_index.json (via its toolsDependencies/
# tools entries) rather than hardcoded here, so a future toolchain bump
# in that file doesn't require touching this workflow.
#
# A separate `hygiene` job runs static checks for the mistakes this
# project has repeatedly made by hand (version fields drifting apart, a
# stray `*/` closing a doc comment early, mcxPinState's pin-name table
# falling out of step with arduino_io.h, and -- at release time --
# shipping a docs/api/ that predates the sources Doxygen reads). It needs
# no toolchain, so it finishes in seconds and reports independently of
# the compile matrix.
#
# Speed: each job builds as many sketches at a time as the runner has
# CPUs (SWEEP_JOBS, see run_builds.sh), each worker with a build cache of
# its own, cloned from the first build's so the core is built once per
# job. There is no cache of arduino-cli's build cache across runs:
# arduino-cli rebuilds core.a whenever the core's sources are newer than
# it, and a fresh checkout always makes them newer, so the restored cache
# was never used -- and it had grown to ~1.6GB, ~45s to restore. What is
# carried between runs is the toolchain download and ccache's cache: ccache
# sits in front of the compiler (see "Put ccache in front of the
# compiler"), so the variant sources every sketch builds are compiled once.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      # To try the next runner image before ubuntu-latest moves to it
      # (e.g. ubuntu-26.04 ahead of the October 2026 switch)
      runner:
        description: 'Runner image'
        default: 'ubuntu-latest'

permissions:
  contents: read

# Per event as well as per ref, so a hand-run (workflow_dispatch) doesn't
# cancel the push run on the same branch, as it did when both shared a group
concurrency:
  group: regression-check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      # Full history only where the release set runs. One of its checks
      # (doxygen-freshness) asks git which commits touched Doxygen's
      # inputs after docs/api/ was last regenerated, which a shallow
      # clone cannot answer -- and this repo's history is ~145MB, so
      # fetching it on every dev push would be paying that for nothing.
      # Note the quoted '0'/'1': GitHub expressions treat bare 0 as
      # falsy, so `cond && 0 || 1` would always yield 1.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '0' || '1' }}

      # --release adds the checks that only mean anything once a version
      # is actually being released: the CHANGELOG heading has to name it,
      # docs/api/ has to have been regenerated since the sources Doxygen
      # reads last changed, and mcxPinState has to have been checked
      # against it. On a dev branch they are legitimately unmet, so asking
      # for them there would fail every push. That package_nxp_mcx_index.json
      # carries an entry for the version is checked by
      # update_package_index.yml (--package-index), not here: the entry
      # reaches main only after the staging-<version> branch's install has
      # been checked, after main and the tag were pushed.
      - name: Repo hygiene checks
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            python3 .github/scripts/check_repo_hygiene.py --release
          else
            python3 .github/scripts/check_repo_hygiene.py
          fi

  compile:
    strategy:
      fail-fast: false
      matrix:
        board: [frdm_mcxa153, frdm_mcxn947, frdm_mcxa156, frdm_mcxn236, frdm_mcxc444]
        # examples: this repo's sketches (the fast or the full tier);
        # third_party: the libraries' examples, only where the full tier
        # runs, on runners of their own so they run beside it
        suite: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["examples", "third_party"]' || '["examples"]') }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine required toolchain version/URL/checksum
        id: toolchain
        run: |
          VERSION=$(jq -r '
            .packages[0].platforms
            | sort_by(.version)
            | last
            | .toolsDependencies[]
            | select(.name=="arm-none-eabi-gcc")
            | .version' package_nxp_mcx_index.json)
          URL=$(jq -r --arg v "$VERSION" '
            .packages[0].tools[]
            | select(.name=="arm-none-eabi-gcc" and .version==$v)
            | .systems[]
            | select(.host=="x86_64-linux-gnu")
            | .url' package_nxp_mcx_index.json)
          CHECKSUM=$(jq -r --arg v "$VERSION" '
            .packages[0].tools[]
            | select(.name=="arm-none-eabi-gcc" and .version==$v)
            | .systems[]
            | select(.host=="x86_64-linux-gnu")
            | .checksum' package_nxp_mcx_index.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v6
        with:
          path: ~/.arduino15/packages/nxp/tools/arm-none-eabi-gcc/${{ steps.toolchain.outputs.version }}
          key: toolchain-linux-x64-${{ steps.toolchain.outputs.version }}

      - name: Download and verify toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.arduino15/packages/nxp/tools/arm-none-eabi-gcc/${{ steps.toolchain.outputs.version }}
          curl -fsSL -o /tmp/toolchain.tar.gz "${{ steps.toolchain.outputs.url }}"
          EXPECTED="${{ steps.toolchain.outputs.checksum }}"
          ACTUAL="SHA-256:$(sha256sum /tmp/toolchain.tar.gz | cut -d' ' -f1)"
          if [[ "$EXPECTED" != "$ACTUAL" ]]; then
            echo "Checksum mismatch: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi
          tar -xzf /tmp/toolchain.tar.gz -C ~/.arduino15/packages/nxp/tools/arm-none-eabi-gcc/${{ steps.toolchain.outputs.version }} --strip-components=1

      # Straight from arduino-cli's GitHub release rather than through
      # arduino/setup-arduino-cli: that action's last release (v2, 2024)
      # still targets Node.js 20, which GitHub has deprecated. Latest
      # release, as the action's default "1.x" gave, checked against the
      # release's own checksum file.
      - name: Install arduino-cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R arduino/arduino-cli --json tagName -q .tagName)
          V="${TAG#v}"
          TARBALL="arduino-cli_${V}_Linux_64bit.tar.gz"
          cd /tmp
          gh release download "$TAG" -R arduino/arduino-cli -p "$TARBALL" -p "${V}-checksums.txt"
          grep " ${TARBALL}\$" "${V}-checksums.txt" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$TARBALL" -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      - name: Install this branch's hardware/nxp/mcx as the board package source
        run: |
          PLATFORM_VERSION=$(grep '^version=' hardware/nxp/mcx/platform.txt | cut -d= -f2)
          mkdir -p "$HOME/.arduino15/packages/nxp/hardware/mcx"
          cp -r hardware/nxp/mcx "$HOME/.arduino15/packages/nxp/hardware/mcx/${PLATFORM_VERSION}"
          echo "PLATFORM_DIR=$HOME/.arduino15/packages/nxp/hardware/mcx/${PLATFORM_VERSION}" >> "$GITHUB_ENV"

      # From ccache's own release rather than apt: Ubuntu 24.04's 4.9.1
      # refuses most of this platform's compile commands ("bad compiler
      # arguments") and caches nothing. Pinned, checked against the
      # release asset's SHA-256 as GitHub lists it.
      - name: Install ccache
        env:
          GH_TOKEN: ${{ github.token }}
          CCACHE_TAG: v4.14.1
          CCACHE_SHA256: ad63d19f5d09ea13f749651653a561c98a59994e673504a4266617b8754218f7
        run: |
          V="${CCACHE_TAG#v}"
          TARBALL="ccache-${V}-linux-x86_64-glibc.tar.xz"
          cd /tmp
          gh release download "$CCACHE_TAG" -R ccache/ccache -p "$TARBALL"
          echo "${CCACHE_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xJf "$TARBALL" --strip-components=1 -C "$HOME/.local/bin" "ccache-${V}-linux-x86_64-glibc/ccache"
          "$HOME/.local/bin/ccache" --version | head -1

      # A new entry every run (the key has the run id); a run starts from the
      # latest one of its board and suite, or else of its board
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache-mcx
          key: ccache-${{ matrix.board }}-${{ matrix.suite }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.board }}-${{ matrix.suite }}-
            ccache-${{ matrix.board }}-

      # Through a platform.local.txt in the installed copy only: compiler.path
      # points at a directory of the toolchain's programs in which gcc, g++
      # and c++ go through ccache. The flags stay the ones platform.txt
      # gives, and ccache returns an object only for the same compiler,
      # flags and source, so the .bin files are the same as without it
      # (checked byte for byte on every FRDM-MCXN947 full-tier sketch).
      # Every sketch builds the variant's sources again (on FRDM-MCXN947,
      # ~3/4 of a sketch's CPU time); with ccache they are compiled once.
      - name: Put ccache in front of the compiler
        run: |
          REAL="$HOME/.arduino15/packages/nxp/tools/arm-none-eabi-gcc/${{ steps.toolchain.outputs.version }}/bin"
          WRAP="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$WRAP"
          for f in "$REAL"/*; do ln -s "$f" "$WRAP/$(basename "$f")"; done
          for t in arm-none-eabi-gcc arm-none-eabi-g++ arm-none-eabi-c++; do
            rm "$WRAP/$t"
            printf '#!/bin/sh\nexec ccache "%s/%s" "$@"\n' "$REAL" "$t" > "$WRAP/$t"
            chmod +x "$WRAP/$t"
          done
          echo "compiler.path=$WRAP/" > "$PLATFORM_DIR/platform.local.txt"
          echo "CCACHE_DIR=$HOME/.cache/ccache-mcx" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          CCACHE_DIR="$HOME/.cache/ccache-mcx" ccache -z

      - name: Compile (fast tier)
        if: matrix.suite == 'examples' && github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: SWEEP_JOBS=$(nproc) .github/scripts/compile_examples.sh ${{ matrix.board }} fast

      - name: Compile (full tier)
        if: matrix.suite == 'examples' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: SWEEP_JOBS=$(nproc) .github/scripts/compile_examples.sh ${{ matrix.board }} full

      - name: Compile third-party libraries' examples
        if: matrix.suite == 'third_party'
        run: SWEEP_JOBS=$(nproc) .github/scripts/compile_third_party.sh ${{ matrix.board }}

      - name: ccache statistics
        if: ${{ !cancelled() }}
        run: ccache -s -v

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache-mcx
          key: ccache-${{ matrix.board }}-${{ matrix.suite }}-${{ github.run_id }}
