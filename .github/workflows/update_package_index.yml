name: Update package_index.json checksums

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  update-checksums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update tool sizes via HEAD request (no download)
        run: |
          python3 << 'PYEOF'
          import json, subprocess

          with open("package_nxp_mcx_index.json") as f:
              pkg = json.load(f)

          for tool in pkg["packages"][0]["tools"]:
              if tool["name"] == "arm-none-eabi-gcc":
                  for sys in tool["systems"]:
                      url = sys["url"]
                      host = sys["host"]
                      print(f"HEAD {host}: {url}")
                      result = subprocess.run(
                          ["curl", "-sI", "--location", url],
                          capture_output=True, text=True
                      )
                      size = None
                      for line in result.stdout.splitlines():
                          if line.lower().startswith("content-length:"):
                              size = line.split(":", 1)[1].strip()
                      if size:
                          sys["size"] = size
                          print(f"  size: {size}")
                      else:
                          print(f"  WARNING: could not get size")

          with open("package_nxp_mcx_index.json", "w") as f:
              json.dump(pkg, f, indent=2)
          print("Done")
          PYEOF

      - name: Download platform ZIP and compute checksum
        run: |
          # package_nxp_mcx_index.json's platforms[] holds one entry per
          # released version (so Boards Manager can offer older versions,
          # not just the latest) -- match by platform.txt's version rather
          # than assuming index 0, so this only ever touches the entry for
          # the version actually being released.
          VERSION=$(grep '^version=' hardware/nxp/mcx/platform.txt | cut -d= -f2)
          echo "Target version: $VERSION"
          URL=$(VERSION="$VERSION" python3 << 'PYEOF'
          import json, os
          version = os.environ["VERSION"]
          with open('package_nxp_mcx_index.json') as f:
              pkg = json.load(f)
          match = [p for p in pkg['packages'][0]['platforms'] if p['version'] == version]
          if not match:
              raise SystemExit(f'No platforms[] entry found for version {version} -- add one before running this workflow')
          print(match[0]['url'])
          PYEOF
          )
          echo "Platform URL: $URL"
          curl -L --silent --show-error "$URL" -o /tmp/platform.zip
          SHA256=$(sha256sum /tmp/platform.zip | awk '{print $1}')
          SIZE=$(wc -c < /tmp/platform.zip | tr -d ' ')
          echo "Platform SHA256: $SHA256"
          echo "Platform SIZE:   $SIZE"
          echo "$SHA256" > /tmp/platform_sha256.txt
          echo "$SIZE"   > /tmp/platform_size.txt
          rm /tmp/platform.zip

      - name: Update platform checksum in package_index.json
        run: |
          VERSION=$(grep '^version=' hardware/nxp/mcx/platform.txt | cut -d= -f2)
          VERSION="$VERSION" python3 << 'PYEOF'
          import json, os

          version = os.environ["VERSION"]

          with open("package_nxp_mcx_index.json") as f:
              pkg = json.load(f)

          with open("/tmp/platform_sha256.txt") as f:
              platform_sha256 = "SHA-256:" + f.read().strip()
          with open("/tmp/platform_size.txt") as f:
              platform_size = f.read().strip()

          match = [p for p in pkg["packages"][0]["platforms"] if p["version"] == version]
          if not match:
              raise SystemExit(f"No platforms[] entry found for version {version}")
          match[0]["checksum"] = platform_sha256
          match[0]["size"] = platform_size

          print(f"Version:            {version}")
          print(f"Platform checksum: {platform_sha256}")
          print(f"Platform size:     {platform_size}")

          with open("package_nxp_mcx_index.json", "w") as f:
              json.dump(pkg, f, indent=2)
          print("Done")
          PYEOF

      - name: Commit updated package_index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package_nxp_mcx_index.json
          git diff --staged --quiet || git commit -m "Update checksums in package_index.json"
          git push
