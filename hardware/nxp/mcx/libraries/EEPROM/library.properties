name=EEPROM
version=1.0.0
author=Tedd OKANO
maintainer=Tedd OKANO
sentence=Keeps 1024 bytes across resets, power cycles and uploads, with the AVR EEPROM library's API.
paragraph=Neither FRDM-MCXA153 nor FRDM-MCXN947 has an EEPROM, so the bytes are kept in the top of the on-chip flash, which the board's linker script keeps the program out of. read()/write()/update(), EEPROM[i], get()/put() of any type and range-for over EEPROM work as on AVR.
