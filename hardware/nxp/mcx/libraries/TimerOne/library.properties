name=TimerOne
version=1.0.0
author=Tedd OKANO
maintainer=Tedd OKANO
sentence=Calls a function every given number of microseconds, with the TimerOne library's API.
paragraph=Timer1.initialize(), setPeriod(), start(), stop(), restart(), resume(), attachInterrupt() and detachInterrupt() work as in the TimerOne library, so sketches written for it build unchanged. The PWM functions (pwm(), setPwmDuty(), disablePwm()) are not provided: use analogWrite() and analogWriteFrequency(). It runs on CTIMER1 on the MCX A and N boards, and on PIT channel 1 on FRDM-MCXC444.
