sentence=Drives hobby RC servos with the official Servo library's API, from a pin with PWM.
paragraph=attach()/detach(), write() in degrees or microseconds, writeMicroseconds(), read() and readMicroseconds() work as in the official Servo library, so sketches written for it build unchanged. The pulses come from the PWM hardware at 50Hz, so the servo has to be on a pin with PWM: PWM0-PWM5, and D3/D5/D6/D9 on FRDM-MCXA156 and FRDM-MCXN236. On any other pin attach() returns INVALID_SERVO.
