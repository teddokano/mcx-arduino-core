sentence=Drives hobby RC servos with the official Servo library's API, from any digital pin.
paragraph=attach()/detach(), write() in degrees or microseconds, writeMicroseconds(), read() and readMicroseconds() work as in the official Servo library, so sketches written for it build unchanged. On a pin with PWM (PWM0-PWM5, D3/D5/D6/D9 on FRDM-MCXA156 and FRDM-MCXN236, and D3/D5/D6/D9/D10 on FRDM-MCXC444) the pulses come from the PWM hardware at 50Hz and don't jitter; on any other pin, from a timer interrupt, as on AVR. Up to 12 servos.
category=Device Control
