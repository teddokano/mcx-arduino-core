paragraph=WDT.begin(ms), refresh(), getTimeout() and getCounter() work as on the UNO R4, so sketches written for it build unchanged. The same watchdog as <avr/wdt.h>: the WWDT on the MCX A and N boards, the COP on FRDM-MCXC444. Like the UNO R4's, it can't be stopped once begun.
