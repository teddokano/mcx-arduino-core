name=mcxTicker
version=1.0.0
author=Tedd OKANO
maintainer=Tedd OKANO
sentence=Calls functions every given time, or once after it, with as many objects as needed, with the API of the ESP32 and ESP8266 cores' Ticker.
paragraph=attach(), attach_ms(), once(), once_ms(), detach() and active() work as in the Ticker of the ESP32 and ESP8266 cores, with a function taking no argument or one; a sketch written for it moves here by changing the #include and the class name to mcxTicker. It runs on the core's 1 ms SysTick interrupt (millis()'s), so it takes no timer and no pin, on every board; times are in whole milliseconds.
