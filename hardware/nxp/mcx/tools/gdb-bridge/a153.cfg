# OpenOCD "configuration file" for FRDM-MCXA153.
#
# Two jobs, neither of them OpenOCD's:
#
#   1. Arduino IDE 2's debug UI refuses to start a session unless at least
#      one configuration file is configured (a check in the IDE itself,
#      separate from arduino-cli's debug backend). This file satisfies it.
#
#   2. It tells gdb-bridge which board to hand LinkServer. Both launch
#      paths pass this file's path -- cortex-debug as `-f`, arduino-cli
#      as `--file` -- so this is how one board-agnostic gdb-bridge binary
#      learns the board, instead of needing one built per board.
#
# Nothing here is ever read as OpenOCD script: debug.server.openocd.path
# does not point at OpenOCD. See gdb-bridge/src/main.go.

# gdb-bridge-device: MCXA153:FRDM-MCXA153
