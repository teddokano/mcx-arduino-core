# Arduino IDE 2's debug UI refuses to start a debug session unless at
# least one "OpenOCD configuration file" is configured (a check in the IDE
# itself, separate from arduino-cli's own debug backend). This board's
# debug.server.openocd.path doesn't actually point at OpenOCD -- see
# gdb-bridge/src/main.go -- so no real OpenOCD script is ever read; this
# file exists purely so that IDE-side check finds something. Its own
# content is never parsed by anything.
